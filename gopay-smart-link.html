<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download GoPay</title>
  <script>
    (function () {
      const android = "https://play.google.com/store/apps/details?id=com.gojek.gopay";
      const ios = "https://apps.apple.com/id/app/gopay-transfer-payment-qris/id6446321594";
      const ua = navigator.userAgent || navigator.vendor || window.opera;

      if (/android/i.test(ua)) {
        window.location.replace(android);
      } else if (/iPad|iPhone|iPod/i.test(ua) && !window.MSStream) {
        window.location.replace(ios);
      }
    })();
  </script>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      background: #f7f7f7;
    }
    .box {
      background: white;
      padding: 32px;
      border-radius: 16px;
      max-width: 420px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
    }
    a {
      display: block;
      margin-top: 12px;
      padding: 12px 16px;
      border-radius: 8px;
      text-decoration: none;
      background: #111;
      color: white;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>Download GoPay</h2>
    <p>Anda akan diarahkan ke toko aplikasi sesuai perangkat Anda.</p>
    <a href="https://play.google.com/store/apps/details?id=com.gojek.gopay">Android – Google Play</a>
    <a href="https://apps.apple.com/id/app/gopay-transfer-payment-qris/id6446321594">iPhone/iPad – App Store</a>
  </div>
</body>
</html>
